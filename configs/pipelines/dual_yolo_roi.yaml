detector:
  backend: tensorrt
  model_id: yolo26-volleyball-640-fp16
  per_camera: true
  input_resolution: [640, 640]
  input_format: bgr8
  resize_mode: letterbox
  confidence_threshold: 0.30
  nms_iou_threshold: 0.40
  max_detections: 10
  center_method: bbox_center

stereo:
  association:
    epipolar_tolerance_px: 12.0
    adaptive_epipolar_height_ratio: 0.35
    max_size_ratio: 2.0
    min_shifted_iou: 0.05
    max_disparity_px: 2048
    bbox_scale: 0.95
    # bbox 尺寸给出粗深度先验，只影响多候选排序，不替代双目几何。
    bbox_disparity_consistency_ratio: 0.30
    bbox_disparity_consistency_min_px: 45.0
    bbox_disparity_penalty_scale: 0.75
    record_rejected: true
  triangulation:
    backend: cuda
    # 几何球心候选，不宣称已经完成真实精度验收。纹理 ROI 在球心恢复前禁用于发布。
    primary_method: circle_center
    # 会实际计算的候选集合；最终选择顺序为 primary 后接 fallback_methods。
    candidate_methods: [circle_center, radial_center, edge_pair_center, edge_centroid, bbox_center, bbox_edges]
    fallback_methods: [radial_center, edge_pair_center, edge_centroid, bbox_center, bbox_edges]
    propagate_covariance: true
    subpixel:
      patch_radius: 5
      search_radius_px: 8
      max_points: 12
      min_points: 4
      min_confidence: 0.25
      max_disparity_delta_px: 2.0
      max_disparity_delta_ratio: 0.03
      max_depth_delta_m: 0.5
      max_stddev_px: 1.0
    circle_fit:
      max_roi_pixels: 18000

