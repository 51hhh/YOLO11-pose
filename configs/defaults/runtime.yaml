schema_version: 1

runtime:
  mode: runtime
  nominal_fps: 90.0
  source_timeout_ms: 1000
  max_consecutive_timeouts: 3
  queue:
    capacity: 3
    overflow_policy: drop_oldest

platform:
  id: generic-host
  accelerator: none
  cuda_arch: null

cameras:
  backend: recorded
  transport:
    interface: recorded
    grab_strategy: recorded
    image_node_num: 1
    embedded_info_clear_rows: 0
  sync:
    method: recorded
    clock_domain: camera-hardware
    trigger_source: null
    trigger_activation: null
    gpio_chip: null
    gpio_line: null
    pwm_duty_cycle: 50.0
    frame_identity_source: recorded
    estimated_error_ns: null
    shutter_type: recorded
    exposure_timestamp_source: recorded
    exposure_delay_status: recorded
    exposure_delay_ns: 0
    exposure_delay_uncertainty_ns: 0
  left:
    id: left-camera
    serial: replay-left
    index: 0
    resolution: [1440, 1080]
    pixel_format: bayer8
    exposure_us: 9000.0
    gain_db: 0.0
    roi: {x: 0, y: 0, width: 1440, height: 1080}
  right:
    id: right-camera
    serial: replay-right
    index: 1
    resolution: [1440, 1080]
    pixel_format: bayer8
    exposure_us: 9000.0
    gain_db: 0.0
    roi: {x: 0, y: 0, width: 1440, height: 1080}

calibration:
  id: vehicle-stereo-main
  file: configs/calibration/stereo_calib.yaml
  format: opencv_yaml
  body_frame: base_link
  rig_frame: nx_left_rectified_optical_frame
  world_frame: world

adapters:
  mainline_pipeline:
    executable: build/nx-mainline-release/apps/nx_mainline/volleyball_nx_mainline
    source_epoch_file: /run/volleyball/nx_source_epoch

rectification:
  backend: opencv
  output_resolution: [1440, 1080]

detector:
  backend: onnxruntime
  model_id: yolo26-volleyball-640-fp16
  per_camera: true
  input_resolution: [640, 640]
  input_format: bgr8
  resize_mode: letterbox
  confidence_threshold: 0.30
  nms_iou_threshold: 0.40
  max_detections: 10
  class_id: 0
  center_method: bbox_center

stereo:
  association:
    epipolar_tolerance_px: 12.0
    adaptive_epipolar_height_ratio: 0.35
    max_size_ratio: 2.0
    min_shifted_iou: 0.05
    max_disparity_px: 2048.0
    bbox_scale: 0.95
    bbox_disparity_consistency_ratio: 0.30
    bbox_disparity_consistency_min_px: 45.0
    bbox_disparity_penalty_scale: 0.75
    record_rejected: true
  triangulation:
    backend: opencv
    primary_method: roi_multi_point
    candidate_methods: [roi_multi_point, circle_center, radial_center, edge_pair_center, edge_centroid, bbox_center, bbox_edges]
    fallback_methods: [circle_center, radial_center, edge_pair_center, edge_centroid, bbox_center, bbox_edges]
    propagate_covariance: true
    subpixel:
      patch_radius: 5
      search_radius_px: 8
      max_points: 12
      min_points: 4
      min_confidence: 0.25
      max_disparity_delta_px: 2.0
      max_disparity_delta_ratio: 0.03
      max_depth_delta_m: 0.5
      max_stddev_px: 1.0
    circle_fit:
      max_roi_pixels: 18000
  min_depth_m: 0.8
  max_depth_m: 15.0
  ball_diameter_m: 0.210

recording:
  enabled: false
  dataset_root: data/captures
  schema_version: 2.1.0
  raw_frames: none
  loss_policy: mark_dropped
  verify_hashes: true

publisher:
  enabled: false
  backend: none
  topic: ""
  frame_id: nx_left_rectified_optical_frame

diagnostics:
  metrics_interval_frames: 900

