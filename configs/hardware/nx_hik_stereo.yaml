platform:
  id: jetson-orin-nx
  accelerator: cuda

cameras:
  backend: hik_mvs
  transport:
    interface: usb3
    # 两侧各自保留到达顺序，禁止 LatestImagesOnly 独立丢旧帧。
    grab_strategy: one_by_one
    image_node_num: 3
    # FrameSpecInfo 先由 SDK 解析，再清除图像首部水印像素。
    embedded_info_clear_rows: 2
  sync:
    method: hardware_trigger
    # 右目原始设备时间会按同步基线映射到左目设备时钟后再入契约。
    clock_domain: hik-shared-device-clock
    trigger_source: Line0
    trigger_activation: RisingEdge
    gpio_chip: gpiochip2
    gpio_line: 7
    pwm_duty_cycle: 50.0
    frame_identity_source: hik_frame_spec_info
    estimated_error_ns: 100000.0
    # 已确认两台相机使用全局快门；球心观测时间取曝光开始加半个曝光时长。
    shutter_type: global
    # GPIO 上升沿估计是曝光开始参考。触发到实际曝光开始的固定延迟尚未测量，
    # 当前明确按 0 假设；null 表示不能把该假设误解为“零不确定度”。
    exposure_timestamp_source: nx_gpio_rising_edge
    exposure_delay_status: assumed_zero_unmeasured
    exposure_delay_ns: 0
    exposure_delay_uncertainty_ns: null
  left:
    id: hik-00D39342665
    serial: "00D39342665"
    index: 0
    resolution: [1440, 1080]
    pixel_format: bayer8
    exposure_us: 9867.0
    gain_db: 11.9906
    roi: {x: 0, y: 0, width: 1440, height: 1080}
  right:
    id: hik-00219471413
    serial: "00219471413"
    index: 1
    resolution: [1440, 1080]
    pixel_format: bayer8
    exposure_us: 9867.0
    gain_db: 11.9906
    roi: {x: 0, y: 0, width: 1440, height: 1080}

rectification:
  backend: cuda

detector:
  backend: tensorrt

stereo:
  triangulation:
    backend: cuda

