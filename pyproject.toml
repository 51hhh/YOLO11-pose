[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyball-vision"
version = "0.1.0"
description = "排球双目感知、采集、回放与验证工具"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18"
]

[project.scripts]
volleyball = "volleyball_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

